version = "1.0"

[metadata]
author_name = "Jumppad Labs"
author_email = "team@jumppad.dev"
difficulty_explanation = "Multi-step CLI workflow requiring the agent to follow JSON instructions, run commands, and progress through all 10 spec steps"
category = "agent-orchestration"
tags = ["spektacular", "spec-workflow", "multi-step", "cli"]

[agent]
# The spec workflow runs an adaptive interview plus nine drafting steps, each
# committed through `spektacular spec file write`. At 600s it was finishing with
# no margin: one run was killed mid-verification, the next completed every step
# and wrote the spec but was killed before emitting its result event. Raised to
# give real headroom, not to mask a hang — a run that needs appreciably more than
# this is stuck and should fail.
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[artifacts]]
source = "/app/.spektacular"
destination = "spektacular"
