name: spektacular
command: go run .
agent: bob
spec_trigger_threshold: moderate
debug:
    enabled: true
spec:
    provider: file
    id_method: counter
    config:
        directory: .spektacular/specs
plan:
    provider: file
    config:
        directory: .spektacular/plans
changelog:
    provider: file
    config:
        directory: .spektacular/changelog
repos:
    - name: spektacular
      local: .
    - name: docs
      address: git@github.com:jumppad-labs/spektacular-website.git
      local: ../spektacular-website
